<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#133b5c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Outer Gold Rim -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Inner Decorative Ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#c59b27" stroke-width="0.8" stroke-dasharray="2 1.5"/>
  <!-- University Monogram -->
  <text x="32" y="37" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="1">BPUT</text>
  <!-- Star / Crest Accent -->
  <polygon points="32,11 33.5,15 37.5,15.5 34.5,18 35.5,22 32,19.5 28.5,22 29.5,18 26.5,15.5 30.5,15" fill="#f59e0b"/>
  <!-- Year / Estd Accent -->
  <text x="32" y="47" font-family="'Inter', sans-serif" font-size="5" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">ESTD 2002</text>
</svg>
